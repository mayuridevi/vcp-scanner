<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1720"><link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>VCP Scanner</title>
<style>
:root{--bg:#0f1720;--card:#18222e;--line:#2a3745;--tx:#e8eef5;--mu:#8fa1b3;--g:#22c55e;--y:#f5b942;--b:#3b82f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif;padding-bottom:40px}
header{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0}main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.lbl{color:var(--mu);font-size:12px;margin:2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 10px;border:1px solid var(--line);border-radius:16px;background:transparent;color:var(--tx);font-size:13px;cursor:pointer}
.chip.on{background:var(--b);border-color:var(--b)}.chip small{color:var(--mu);margin-left:4px}.chip.on small{color:#dbeafe}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label.f{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select{background:#0f1720;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:7px;font-size:14px;width:100%}
label.ck{display:flex;gap:6px;align-items:center;font-size:13px}label.ck input{width:auto}
button.btn{background:var(--g);color:#06200f;border:0;border-radius:8px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer}
button.btn.sec{background:#243344;color:var(--tx);font-weight:500;font-size:13px;padding:8px 12px}
.bar{height:6px;background:#243344;border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--b)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:10px 0}.tab{flex:1;text-align:center;padding:9px;border-radius:8px;border:1px solid var(--line);cursor:pointer}.tab.on{background:#243344;border-color:var(--b)}
.sec-h{display:flex;justify-content:space-between;padding:9px 10px;background:#1e2b3a;border-radius:8px;margin:6px 0;cursor:pointer;font-weight:600}
.stk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--g);border-radius:8px;padding:9px;margin:6px 0}
.stk.w{border-left-color:var(--y)}.stk a{color:var(--tx);font-weight:700;text-decoration:none}.mu{color:var(--mu);font-size:12px}
.up{color:var(--g)}.pill{display:inline-block;background:#243344;border-radius:10px;padding:1px 8px;font-size:11px;margin-right:4px}
svg.sp{grid-column:1/3;width:100%;height:46px;margin-top:4px}
.note{color:var(--mu);font-size:12px}.err{color:#f87171}
</style></head><body>
<header><h1>VCP Scanner</h1><span class="mu" id="stat"></span></header>
<main>
<div class="card"><div class="lbl">Universe</div><div class="chips" id="uni"></div>
<div class="row" style="margin-top:8px"><button class="btn sec" id="imp">Import CSV…</button><input type="file" id="file" accept=".csv" multiple hidden>
<span class="note" id="impmsg"></span></div></div>

<div class="card"><div class="grid">
<label class="f">Chart timeframe<select id="tf"><option value="D">Daily</option><option value="W">Weekly</option><option value="M">Monthly</option></select></label>
<label class="f">Min contractions (T)<input id="minT" type="number" min="2" max="6"></label>
<label class="f">Max last pullback %<input id="maxLast" type="number" step="0.5"></label>
<label class="f">Zig-zag swing % (sensitivity)<input id="dev" type="number" step="0.5"></label>
<label class="f">Lookback bars<input id="lookback" type="number" step="10"></label>
<label class="f">Max age of last low (bars)<input id="maxAge" type="number"></label></div>
<div class="row" style="margin-top:8px">
<label class="ck" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px"><input type="checkbox" id="higherLows"><b>Higher Lows</b>&nbsp;<span class="note">(extra condition, OFF by default)</span></label>
<label class="ck"><input type="checkbox" id="volDry">Volume dry-up</label>
<label class="ck"><input type="checkbox" id="stage2">Stage 2 (Daily only)</label></div>
<div class="row" style="margin-top:8px"><label class="f" style="flex:1">Data proxy<select id="proxy">
<option value="corsproxy">corsproxy.io</option><option value="allorigins">allorigins.win</option><option value="codetabs">codetabs.com</option><option value="worker">My Cloudflare Worker</option></select></label>
<label class="f" style="flex:2">Worker URL (if selected)<input id="worker" placeholder="https://your-worker.workers.dev"></label></div></div>

<div class="row"><button class="btn" id="go">Scan</button><button class="btn sec" id="stop" hidden>Stop</button><span class="note" id="msg"></span></div>
<div class="bar"><i id="pb"></i></div>

<div class="tabs"><div class="tab on" data-t="buy">BUY <span id="nb">0</span></div><div class="tab" data-t="watch">WATCH <span id="nw">0</span></div></div>
<div class="row" style="margin-bottom:6px"><label class="ck"><input type="checkbox" id="bySector" checked>Group by sector</label></div>
<div id="out"></div>
<p class="note">BUY = latest close is above the high of the last completed candle (the VCP line) after a shrinking-pullback sequence counted from the last candle backwards. WATCH = VCP is formed but price has not closed above the line yet. Not investment advice.</p>
</main>
<script src="lists.js"></script><script src="vcp.js"></script><script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');</script>
</body></html>
